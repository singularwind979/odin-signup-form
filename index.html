<!DOCTYPE html>
<!-- Add appropriate language for your site -->
<html lang="en">
<head>
  <!-- `utf-8` is a character set including many universal characters -->
  <meta charset="utf-8">

  <!-- `viewport` ensures that items scale correctly on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- `title` sets the page title, which appears in the browser tab and search results.
   `author` sets your name and `description` provides a brief overview.
   Used by search engines. -->
  <title>Sign-up Form</title>
  <meta name="author"      content="Singularwind">
  <meta name="description" content="Sign-up form with client-side validation, built for The Odin Project.">

  <!-- `og` stands for Open Graph, a protocol for sharing content on social media.
   Used to create a share card. -->
  <meta property="og:type"        content="website">
  <meta property="og:url"         content="https://singularwind979.github.io/odin-signup-form/">
  <meta property="og:site_name"   content="Sign-up Form">
  <meta property="og:title"       content="Sign-up Form">
  <meta property="og:description" content="Sign-up form with client-side validation, built for The Odin Project.">

  <!-- CSS and JS entry points -->
  <link rel="stylesheet" href="css/index.css">
  <script type="module" src="dist/index.js"></script>
</head>

<body>
  <aside>
    <img src="assets/imgs/bg.jpg">
    <div class="icon-logo">The Odin Project</div>
  </aside>

  <main>
    <h1 class="title">Get Started</h1>
    <form id="sign-up" action="/" method="post">
      <fieldset id="names">
        <legend class="field">NAME</legend>
        <div class="set">
          <label class="icon-user" for="fname">First Name</label>
          <input type="text" id="fname" name="fname" autocomplete="given-name" required>
        </div>
        <div class="set">
          <label class="icon-users" for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" autocomplete="family-name" required>
        </div>
      </fieldset>
      <fieldset id="contacts">
        <legend class="field">CONTACT</legend>
        <div class="set">
          <label class="icon-mail" for="email">Email Address</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="set">
          <label class="icon-phone" for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" autocomplete="tel" required>
        </div>
      </fieldset>
      <fieldset id="passwords">
        <legend class="field">PASSWORD</legend>
        <div class="set">
          <label class="icon-lock-open" for="pwd">Password</label>
          <input type="password" id="pwd" name="pwd" minlength="8" autocomplete="new-password" required>
        </div>
        <div class="set">
          <label class="icon-lock-close" for="confirm-pwd">Confirm Password</label>
          <input type="password" id="confirm-pwd" name="confirm-pwd" minlength="8" autocomplete="new-password" required>
        </div>
      </fieldset>
      <div class="actions">
        <button type="submit" id="submit-btn" class="icon-submit">Create Account</button>
        <button type="reset" id="reset-btn" class="icon-reset">Clear Information</button>
      </div>
    </form>
  </main>

  <footer>
    <p>&copy; <time datetime="2026">2026</time> Singularwind</p>
  </footer>
</body>
</html>
